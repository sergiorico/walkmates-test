<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>WalkMates</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; color: #222; }
        h1 { margin-bottom: 0; }
        .tag { color: #666; margin-top: .25rem; }
        table { border-collapse: collapse; width: 100%; margin-top: 1.5rem; }
        th, td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid #eee; }
        .pill { font-size: .8rem; padding: .1rem .5rem; border-radius: 1rem; background: #eef; }
    </style>
</head>
<body>
<h1>🐾 WalkMates</h1>
<p class="tag">People matched with animal-care opportunities — a teaching system for software testing.</p>

<h2>Available opportunities</h2>
<table>
    <thead>
    <tr><th>Title</th><th>Type</th><th>SEK/hour</th><th>Status</th></tr>
    </thead>
    <tbody>
    <tr th:each="l : ${listings}">
        <td th:text="${l.title}">Title</td>
        <td><span class="pill" th:text="${l.type}">TYPE</span></td>
        <td th:text="${l.baseRatePerHour}">0</td>
        <td th:text="${l.status}">AVAILABLE</td>
    </tr>
    </tbody>
</table>

<p class="tag">REST API: <code>/api/listings</code>, <code>/api/bookings</code>,
    <code>/api/match/{seekerId}/explain?listingId=...</code></p>
</body>
</html>
