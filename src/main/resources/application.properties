spring.application.name=WalkMates
server.port=8080

# Provider-managed pets and service definitions persist locally between restarts. Runtime
# bookings, wallet changes, and the frozen lab repositories remain in memory by design.
spring.datasource.url=jdbc:h2:file:./data/walkmates-catalog;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=never
